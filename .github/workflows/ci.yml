name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke
        run: |
          node dist/index.js --version
          node dist/index.js --help
          node dist/index.js recordings --help
          node dist/index.js recordings transcript --help

      - name: Pack whitelist
        run: |
          npm pack --dry-run --json --loglevel=error > /tmp/pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const raw = JSON.parse(readFileSync("/tmp/pack.json", "utf8"));
            const info = Array.isArray(raw) ? raw[0] : raw;
            const files = (info.files ?? []).map((f) => f.path);
            const required = ["LICENSE", "README.md", "dist/index.js", "package.json"];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error("pack missing required files:", missing.join(", "));
              process.exit(1);
            }
            const banned = files.filter((f) =>
              f === ".env" || f === "config.json" || f.startsWith("node_modules/") || f.endsWith("/.env")
            );
            if (banned.length) {
              console.error("pack includes banned files:", banned.join(", "));
              process.exit(1);
            }
            console.log("pack ok:", files.join(", "));
          '
